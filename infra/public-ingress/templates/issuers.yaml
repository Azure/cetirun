{{- range $name, $server := dict .Values.acme.stagingIssuerName "https://acme-staging-v02.api.letsencrypt.org/directory" .Values.acme.productionIssuerName "https://acme-v02.api.letsencrypt.org/directory" }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    {{- include "cetirun-public-ingress.keep" $ | nindent 4 }}
  labels:
    {{- include "cetirun-public-ingress.labels" $ | nindent 4 }}
spec:
  acme:
    {{- with $.Values.acme.email }}
    email: {{ . | quote }}
    {{- end }}
    server: {{ $server | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account" $name | quote }}
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ $.Values.gateway.name }}
                namespace: {{ $.Release.Namespace }}
                group: gateway.networking.k8s.io
                sectionName: acme-http
                kind: Gateway
                port: 80
            podTemplate:
              metadata:
                annotations:
                  sidecar.istio.io/inject: "false"
{{- end }}
