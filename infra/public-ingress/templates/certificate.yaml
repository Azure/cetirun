{{- if .Values.acme.stagingCertificateEnabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.acme.stagingCertificateName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "cetirun-public-ingress.keep" . | nindent 4 }}
  labels:
    {{- include "cetirun-public-ingress.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.acme.stagingSecretName }}
  dnsNames: [{{ .Values.domain | quote }}]
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ .Values.acme.stagingIssuerName }}
  privateKey:
    rotationPolicy: Always
{{- end }}
{{- if .Values.acme.productionCertificateEnabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.acme.productionCertificateName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "cetirun-public-ingress.keep" . | nindent 4 }}
  labels:
    {{- include "cetirun-public-ingress.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.acme.productionSecretName }}
  dnsNames: [{{ .Values.domain | quote }}]
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ .Values.acme.productionIssuerName }}
  privateKey:
    rotationPolicy: Always
{{- end }}
