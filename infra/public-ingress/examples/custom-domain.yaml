# Synthetic example. Configure DNS A/CNAME to the ingress IP before preparation.
target:
  kubeconfig: /absolute/private/kubeconfig
  context: example-aks-admin
  cluster: example-aks
  server: https://kubernetes.example.invalid:443
  clusterUID: 11111111-1111-1111-1111-111111111111
ingress:
  namespace: aks-istio-ingress
  service: aks-istio-ingressgateway-external
  release: cetirun-public-ingress
  gatewayName: cetirun-acme-http
dns:
  mode: custom
  domain: portal.example.com
certManager:
  # Reuse the explicitly selected, compatible, ready Helm installation.
  mode: existing
  namespace: cert-manager
  release: cert-manager
acme:
  email: ""
stateDirectory: /absolute/private/cetirun-public-ingress
timeoutSeconds: 600
