{{- if .Values.egress.blacklist.enabled }}
{{- if or .Values.egress.blacklist.fqdns .Values.egress.blacklist.ipCidrs }}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: {{ printf "%s-blacklist" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Values.egress.namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  configPatches:
  - applyTo: NETWORK_FILTER
    match:
      context: SIDECAR_OUTBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.tcp_proxy
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.network.rbac
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
          stat_prefix: egress_blacklist
          rules:
            action: DENY
            policies:
              {{- if .Values.egress.blacklist.fqdns }}
              deny-fqdn:
                permissions:
                - or_rules:
                    rules:
                    {{- range .Values.egress.blacklist.fqdns }}
                    {{- if hasPrefix "." . }}
                    - requested_server_name:
                        suffix: {{ . | quote }}
                    {{- else }}
                    - requested_server_name:
                        exact: {{ . | quote }}
                    {{- end }}
                    {{- end }}
                principals:
                - any: true
              {{- end }}
              {{- if .Values.egress.blacklist.ipCidrs }}
              deny-ip:
                permissions:
                - or_rules:
                    rules:
                    {{- range .Values.egress.blacklist.ipCidrs }}
                    {{- $parts := splitList "/" . }}
                    - destination_ip:
                        address_prefix: {{ index $parts 0 | quote }}
                        prefix_len: {{ if gt (len $parts) 1 }}{{ index $parts 1 }}{{ else }}32{{ end }}
                    {{- end }}
                principals:
                - any: true
              {{- end }}
  # Block plain HTTP at network level (connection reset, same as HTTPS)
  - applyTo: NETWORK_FILTER
    match:
      context: SIDECAR_OUTBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.network.rbac
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
          stat_prefix: egress_blacklist_http
          rules:
            action: DENY
            policies:
              {{- if .Values.egress.blacklist.fqdns }}
              deny-fqdn-http:
                permissions:
                - or_rules:
                    rules:
                    {{- range .Values.egress.blacklist.fqdns }}
                    {{- if hasPrefix "." . }}
                    - requested_server_name:
                        suffix: {{ . | quote }}
                    {{- else }}
                    - requested_server_name:
                        exact: {{ . | quote }}
                    {{- end }}
                    {{- end }}
                principals:
                - any: true
              {{- end }}
              {{- if .Values.egress.blacklist.ipCidrs }}
              deny-ip-http:
                permissions:
                - or_rules:
                    rules:
                    {{- range .Values.egress.blacklist.ipCidrs }}
                    {{- $parts := splitList "/" . }}
                    - destination_ip:
                        address_prefix: {{ index $parts 0 | quote }}
                        prefix_len: {{ if gt (len $parts) 1 }}{{ index $parts 1 }}{{ else }}32{{ end }}
                    {{- end }}
                principals:
                - any: true
              {{- end }}
{{- end }}
{{- end }}
