{{/*
Cookie secret handling:
- If user provides .Values.cookieSecret (32-char string), use it.
- Otherwise, try to reuse the existing secret from a previous deployment.
- If no existing secret exists, generate a new 32-character alphanumeric secret.

Note: We use randAlphaNum (not randBytes) to generate printable ASCII characters,
      avoiding UTF-8 encoding issues. The 32-char string becomes the AES key for
      OAuth2 Proxy sessions.

Migration: This chart moved OAuth2 Proxy from istio-system to cetirun-istio.
           We check both namespaces to preserve sessions during migration.
*/}}
{{- $cookieSecret := "" -}}
{{- if .Values.cookieSecret -}}
  {{/* User-provided secret: base64-encode for Secret data field */}}
  {{- $cookieSecret = .Values.cookieSecret | b64enc -}}
{{- else -}}
  {{/* Try to lookup existing secret in current namespace */}}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "oauth2-proxy-credentials" -}}
  {{- if and $existingSecret $existingSecret.data (index $existingSecret.data "cookie-secret") -}}
    {{/* Reuse existing secret value (already base64-encoded) */}}
    {{- $cookieSecret = index $existingSecret.data "cookie-secret" -}}
  {{- else -}}
    {{/* Fallback: check istio-system for migration from previous deployment location */}}
    {{- $legacySecret := lookup "v1" "Secret" "istio-system" "oauth2-proxy-credentials" -}}
    {{- if and $legacySecret $legacySecret.data (index $legacySecret.data "cookie-secret") -}}
      {{/* Migrate secret from istio-system */}}
      {{- $cookieSecret = index $legacySecret.data "cookie-secret" -}}
    {{- else -}}
      {{/* Generate 32-char alphanumeric string, base64-encode for Secret data field */}}
      {{- $cookieSecret = randAlphaNum 32 | b64enc -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-istio.labels" . | nindent 4 }}
type: Opaque
data:
  cookie-secret: {{ $cookieSecret }}
