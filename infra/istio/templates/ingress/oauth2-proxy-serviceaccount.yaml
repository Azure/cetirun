{{- $clientId := required "clientId is required for Workload Identity" .Values.clientId -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
  annotations:
    azure.workload.identity/client-id: {{ $clientId | quote }}
  labels:
    azure.workload.identity/use: "true"
    {{- include "cetirun-istio.labels" . | nindent 4 }}
