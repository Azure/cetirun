apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cetirun-keyvault-tls.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-keyvault-tls.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cetirun-keyvault-tls.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        checksum/identity: {{ include (print $.Template.BasePath "/serviceaccount.yaml") . | sha256sum }}
        checksum/provider: {{ include (print $.Template.BasePath "/secretproviderclass.yaml") . | sha256sum }}
      labels:
        {{- include "cetirun-keyvault-tls.labels" . | nindent 8 }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      nodeSelector:
        cetirun.microsoft.com/pool: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "cetirun-keyvault-tls.name" . }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
      containers:
        - name: sync-consumer
          image: {{ include "cetirun-keyvault-tls.image" . }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["while true; do sleep 3600; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "cetirun-keyvault-tls.fullname" . }}
