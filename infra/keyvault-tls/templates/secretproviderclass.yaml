{{- $kv := .Values.keyVault -}}
{{ include "cetirun-keyvault-tls.validate" . }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "cetirun-keyvault-tls.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-keyvault-tls.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.secretName }}
      type: kubernetes.io/tls
      data:
        - objectName: certificate-bundle
          key: tls.crt
        - objectName: certificate-bundle
          key: tls.key
  parameters:
    usePodIdentity: "false"
    clientID: {{ $kv.clientId | quote }}
    keyvaultName: {{ $kv.name | quote }}
    tenantId: {{ $kv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $kv.certificateSecretName }}
          objectType: secret
          objectVersion: ""
          objectFormat: pem
          objectAlias: certificate-bundle
