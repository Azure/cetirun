<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}" class="no-js">
  <head>{{ partial "head.html" . }}</head>
  <body class="td-{{ .Kind }}">
    <a class="cr-skip" href="#main-content">Skip to main content</a>
    <header class="cr-header">{{ partial "navbar.html" . }}</header>
    <main class="cr-main" id="main-content" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "scripts.html" . }}
  </body>
</html>
