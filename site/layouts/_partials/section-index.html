{{ if and (not .Params.no_list) .Pages }}
{{ $module := partial "navigation-module.html" . }}
<div class="section-index">
  {{ range .Pages.ByWeight }}
  {{ if eq (partial "navigation-module.html" .).id $module.id }}
  <section class="entry">
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <p>{{ .Description }}</p>
  </section>
  {{ end }}
  {{ end }}
</div>
{{ end }}
