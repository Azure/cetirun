{{- /* The layers of the platform, from the Portal down to Kubernetes. */ -}}
<svg viewBox="0 0 380 364" role="img" aria-labelledby="cr-bp-title cr-bp-desc">
  <title id="cr-bp-title">Architecture of CetiRun</title>
  <desc id="cr-bp-desc">Users open the Portal. The Portal uses the control plane, which has the operator, the Skill Marketplace, governance, and Agent Identity. The control plane manages the Agents of Team A and Team B. Team A has a Hermes Agent and Team B has an OpenClaw Agent. Each Agent can have a GitHub Copilot proxy. The two Agents call the model providers through the shared AI Gateway. CetiAdmin, observability, and Helm charts support the platform. All components run on Kubernetes.</desc>
