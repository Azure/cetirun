{{- /* The pages write a warning as a quotation that opens with a bold "Warning:" label. */ -}}
<blockquote class="cr-callout{{ if findRE `^\s*<p><strong>Warning:?</strong>` .Text 1 }} cr-callout--warning{{ end }}">
  {{ .Text }}
</blockquote>
