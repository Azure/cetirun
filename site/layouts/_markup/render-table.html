{{- /*
  Hugo's default table, inside an element that scrolls a wide table instead of
  the page. The td-initial class keeps Docsy's table styles away.
*/ -}}
<div class="cr-table-scroll">
  <table class="td-initial">
    <thead>
      {{- range .THead }}
        <tr>
          {{- range . }}
            <th {{- with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>
              {{- .Text -}}
            </th>
          {{- end }}
        </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
        <tr>
          {{- range . }}
            <td {{- with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>
              {{- .Text -}}
            </td>
          {{- end }}
        </tr>
      {{- end }}
    </tbody>
  </table>
</div>
