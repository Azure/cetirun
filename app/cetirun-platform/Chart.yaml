apiVersion: v2
name: cetirun-platform
description: Helm umbrella chart for CetiRun platform control-plane components
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - cetirun
  - platform
  - kubernetes
dependencies:
