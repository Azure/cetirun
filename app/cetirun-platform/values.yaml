# CetiRun platform umbrella defaults. This chart deliberately does not own
# managed Istio, external credentials, certificates, agent instances, or their
# data. The Operator subchart owns the Registry source namespace (retained on
# uninstall); per-Agent credential Secrets are owned by their Agent UID.

# -- Shared release coordinates propagated automatically to the Operator,
# Portal and AI Gateway subcharts.
global:
  # -- Optional full Memory image override. Empty follows registry/version.
  memoryContext:
    image: ""
  # -- Enable both Portal Chat and its private runtime caller. No database.
  portalChat:
    enabled: false
    identityRealm: ""
  # -- Optional registry hostname override propagated to all CetiRun subcharts.
  # Empty preserves each subchart's existing repository defaults.
  registry: ""
  # -- Optional image and chart version override propagated to all subcharts.
  # Empty preserves each synchronized subchart's existing version defaults.
  version: ""
  # -- Shared by Portal and Operator; separate from the Agent Identity Broker.
  registryCredentialNamespace: cetirun-registry-credentials

istio:
  # A separately managed cetirun-istio release must be ready before installing
  # this chart. The deployment helper checks these references against the API.
  enabled: false
  oauth2Proxy:
    name: oauth2-proxy
    namespace: cetirun-istio

cetirun-operator:
  enabled: true
  namespace: cetirun-system
  # Gateway used by instance VirtualServices. It must match the Portal gateway.
  istioGateway: "aks-istio-ingress/cetirun-gateway"
  cetirun:
    helmValues:
      # Namespace that contains the ingress Gateway workload allowed by instance
      # NetworkPolicies. It must match the namespace in istioGateway.
      networkPolicy:
        istioIngressNamespace: aks-istio-ingress
  # Required for instance URLs and VirtualServices. The deployment helper sets
  # this from DOMAIN.
  domainSuffix: ""
  # OpenClaw and Hermes Agents take their models from the AI Gateway; the
  # platform requires it.
  # Without a url, the operator uses cetirun-ai-gateway in its namespace.
  aiGateway:
    enabled: true

cetirun-portal:
  enabled: true
  istio:
    host: ""
    # Gateway and source identity used by the portal's VirtualService and
    # AuthorizationPolicy. They must reference the separately managed gateway.
    gateway: "aks-istio-ingress/cetirun-gateway"
    gatewayNamespace: aks-istio-ingress
    gatewayServiceAccount: aks-istio-ingressgateway-external
  # The Portal offers the AI Gateway's model sources and the GitHub Copilot
  # sign-in; the platform requires it.
  features:
    aiGatewayEnabled: true
  aiGateway:
    # The operator publishes the shared models in its own namespace, where
    # the Portal reads them: keep this equal to cetirun-operator.namespace.
    # The deployment helper sets both from NAMESPACE.
    catalogNamespace: cetirun-system

cetirun-ai-gateway:
  # -- Install the AI Gateway with the operator and Portal. Turn it off only
  # when a Gateway is installed separately in the operator namespace.
  enabled: true
  # The operator reaches the Gateway as cetirun-ai-gateway and reads its master
  # key from the cetirun-ai-gateway-auth Secret, so keep this name.
  fullnameOverride: cetirun-ai-gateway
  # This Gateway serves CetiRun Agents: it reserves the copilot/ model names
  # for their GitHub Copilot routes and checks router fallback targets against
  # the caller's key. The chart refuses to install it turned off.
  operatorIntegration: true
  # -- Shared model candidates granted through the selected AgentPolicy.
  # The Gateway chart generates their deployment IDs and per-model access
  # groups; the old cetirun-shared group is not a policy grant. Each model
  # still needs pricing while the Gateway blocks unpriced models.
  # An empty list is valid, but console-only models are not trusted shared
  # bindings. Agents need an authorized model entitlement before model use.
  models: []
  # -- LiteLLM's Prometheus metrics, on a port of their own in each Gateway
  # pod, and a PodMonitor for Azure Monitor managed Prometheus, which the
  # CetiRun cluster template turns on. The PodMonitor is created only where
  # the cluster serves its API.
  metrics:
    enabled: true
    podMonitor:
      enabled: true
  # -- LiteLLM's own row per call in its database is not kept: the Gateway's
  # request log on stdout records each call, and the cluster's log collection
  # keeps it outside the database. Spend, budgets and daily usage totals are
  # recorded either way.
  spendLogs:
    enabled: false
