name: cetirun_teams
label: Microsoft Teams (Workload Identity)
kind: platform
version: 0.1.1
description: Microsoft Teams adapter with Azure Workload Identity auth for CetiRun
requires_env:
  - name: MSTEAMS_APP_ID
    description: "Azure AD application (Bot Framework) client ID"
    prompt: "Teams / Azure AD client ID"
    password: false
optional_env:
  - name: MSTEAMS_TENANT_ID
    description: "Azure AD tenant ID (for single-tenant JWT validation)"
    prompt: "Teams / Azure AD tenant ID"
    password: false
  - name: MSTEAMS_WEBHOOK_PORT
    description: "Webhook listen port (default: 3978)"
    prompt: "Webhook port"
    password: false
