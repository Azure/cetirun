{{- if .Values.sandboxWorkload -}}
{{- include "cetirun.sandbox.validate" . -}}
{{- end -}}
{{- if eq (include "cetirun.agent.type" .) "custom" -}}
{{- include "cetirun.custom.validate" . -}}
{{- include "cetirun.validateAutoscaling" . -}}
{{- else if or .Release.IsInstall .Release.IsUpgrade -}}
{{- include "cetirun.validateSecrets" . -}}
{{- include "cetirun.validateAutoscaling" . -}}
{{- include "cetirun.validatePorts" . -}}
{{- include "cetirun.validateWorkloadIdentity" . -}}
{{- include "cetirun.validateAgentIdentity" . -}}
{{- include "cetirun.validateTtydPort" . -}}
{{- include "cetirun.validateSkills" . -}}
{{- include "cetirun.validateDesktopBrowserConfig" . -}}
{{- end -}}
