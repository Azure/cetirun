{{- if and (ne (include "cetirun.agent.type" .) "custom") .Values.skills.shared }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "cetirun.sharedSkillsPVName" . }}
  labels:
    {{- include "cetirun.labels" . | nindent 4 }}
  annotations:
    pv.kubernetes.io/provisioned-by: blob.csi.azure.com
spec:
  capacity:
    storage: {{ .Values.skills.storageSize }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.skills.storageClassName }}
  {{- with .Values.skills.mountOptions }}
  mountOptions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ include "cetirun.sharedSkillsPVCName" . }}
  csi:
    driver: blob.csi.azure.com
    volumeHandle: {{ include "cetirun.sharedSkillsPVName" . }}
    volumeAttributes:
      resourceGroup: {{ .Values.skills.resourceGroup }}
      storageAccount: {{ .Values.skills.storageAccount }}
      containerName: {{ .Values.skills.containerName }}
      protocol: {{ .Values.skills.protocol | default "nfs" }}
    {{- if ne (.Values.skills.protocol | default "nfs") "nfs" }}
    nodeStageSecretRef:
      name: {{ required "skills.secretName is required for Blob Fuse mounts" .Values.skills.secretName }}
      namespace: {{ .Release.Namespace }}
    {{- end }}
{{- end }}
