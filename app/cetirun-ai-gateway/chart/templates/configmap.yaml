{{/*
  Generated LiteLLM configuration.

  Provider parameters are passed through unchanged. Operator integration adds
  a per-configuration model binding; standalone model lists stay unchanged.

  The chart writes as little as possible into the settings blocks below. Editing
  any field of one of these blocks in the admin console persists the whole block
  to the database, after which the database wins on every key in it and values
  from this file stop taking effect. The fewer keys here, the smaller that
  surface.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cetirun-ai-gateway.configMapName" . }}
  labels:
    {{- include "cetirun-ai-gateway.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
      {{- if .Values.operatorIntegration }}
      {{- $models := list }}
      {{- range .Values.models }}
      {{- $model := deepCopy . }}
      {{- $suffix := sha256sum (toJson $model) | trunc 16 }}
      {{- $info := deepCopy ($model.model_info | default dict) }}
      {{- $_ := set $info "id" (printf "cetirun-shared-%s" $suffix) }}
      {{- $_ = set $info "access_groups" (append ($info.access_groups | default list) (printf "cetirun-model-%s" $suffix) | uniq) }}
      {{- $_ = set $model "model_info" $info }}
      {{- $models = append $models $model }}
      {{- end }}
      {{- toYaml $models | nindent 6 }}
      {{- else }}
      {{- toYaml .Values.models | nindent 6 }}
      {{- end }}

    general_settings:
      # Required for the management API and the admin console to persist models.
      store_model_in_db: true
      {{- if .Values.operatorIntegration }}
      # Router fallbacks are chosen after the key is checked. Check each
      # fallback target against the caller's key as well, so a fallback cannot
      # reach a model the key may not use, such as another Agent's GitHub
      # Copilot route.
      enforce_fallback_model_access: true
      {{- end }}

    litellm_settings:
      # No retries in the Gateway. LiteLLM retries a failed upstream call twice
      # by default, and agents retry on their own, so the two multiply: one
      # failing request was measured at three upstream calls, which an agent
      # retrying twice itself would turn into nine. Retrying a 429 makes rate
      # limiting worse. Errors go straight back to the caller, which decides.
      num_retries: 0
      {{- if .Values.blockUnpricedModels }}
      # A model missing from LiteLLM's price table costs zero, and budget checks
      # are skipped for zero-cost models, so a budget on a key silently does
      # nothing. Azure OpenAI deployment names are not in that table, which
      # makes this the ordinary case rather than an edge one.
      block_requests_for_models_without_pricing: true
      {{- end }}
      # A caller cannot turn recording off for its own calls by sending
      # "no-log": true.
      global_disable_no_log_param: true
      {{- /* The request log is not registered here: the image's entrypoint
      registers it, and turns LiteLLM's spend log off with it (see
      cetirun-ai-gateway.proxyEnv). */}}
      {{- $metrics := (include "cetirun-ai-gateway.logsAndMetrics" . | fromJson).metrics }}
      {{- if $metrics.enabled }}
      # metrics: LiteLLM's Prometheus metrics.
      callbacks: ["prometheus"]
      {{- if $metrics.excludeLabels }}
      prometheus_exclude_labels: {{ toJson $metrics.excludeLabels }}
      {{- end }}
      {{- end }}
    {{- if include "cetirun-ai-gateway.redisEnabled" . }}
      # Redis is declared here for coordination, not for caching responses.
      #
      # Budgets and rate limits are only shared across replicas once LiteLLM's
      # cache is Redis-backed, so the cache has to be configured. But enabling
      # it also caches responses by default: an identical request is answered
      # from Redis, recorded at zero spend, not counted against the budget, and
      # shared across every caller who sends the same content. An agent that
      # retries after a bad answer gets the same bad answer back.
      #
      # default_off keeps the Redis-backed coordination and turns response
      # caching into something a request has to ask for.
      cache: true
      cache_params:
        type: redis
        mode: default_off
        host: {{ include "cetirun-ai-gateway.redisHost" . | quote }}
        port: {{ include "cetirun-ai-gateway.redisPort" . }}
        {{- if include "cetirun-ai-gateway.redisPasswordSecret" . }}
        password: os.environ/REDIS_PASSWORD
        {{- end }}

    # Redis has to be declared in both blocks. Configuring only litellm_settings
    # leaves router coordination unset: budgets keep doubling across replicas
    # while the deployment looks correctly configured and Redis stays empty.
    router_settings:
      redis_host: {{ include "cetirun-ai-gateway.redisHost" . | quote }}
      redis_port: {{ include "cetirun-ai-gateway.redisPort" . }}
      {{- if include "cetirun-ai-gateway.redisPasswordSecret" . }}
      redis_password: os.environ/REDIS_PASSWORD
      {{- end }}
    {{- end }}
