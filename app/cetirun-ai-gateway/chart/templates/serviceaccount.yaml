{{- if .Values.serviceAccount.create -}}
{{- $annotations := deepCopy (.Values.serviceAccount.annotations | default dict) }}
{{- if dig "enabled" false (.Values.content | default dict) }}
{{- $_ := set $annotations "azure.workload.identity/client-id" .Values.content.clientId }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cetirun-ai-gateway.serviceAccountName" . }}
  labels:
    {{- include "cetirun-ai-gateway.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
