{{/*
  Credentials of the bundled PostgreSQL and Valkey.

  Generated on first install, read back on every upgrade, and kept on
  helm uninstall, the same as the auth Secret. The PostgreSQL volume outlives
  the release, and PostgreSQL keeps the password it was initialised with, so a
  regenerated password would lock the Gateway out of its own database on the
  next install.
*/}}
{{- if .Values.postgresql.bundled.enabled }}
{{- $name := include "cetirun-ai-gateway.postgresqlName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cetirun-ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  database-url: {{ printf "postgresql://litellm:%s@%s:5432/litellm" $password $name | b64enc | quote }}
{{- end }}
{{- if .Values.redis.bundled.enabled }}
{{- $name := include "cetirun-ai-gateway.valkeyName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cetirun-ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
