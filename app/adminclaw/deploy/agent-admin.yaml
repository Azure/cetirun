# AdminClaw — Agent CR for operator-managed deployment.
# The operator will:
#   1. Ensure namespace cetirun-admin exists (with Istio sidecar label)
#   2. Create gateway token Secret (gateway-token)
#   3. Deploy openclaw chart as Helm release "openclaw-admin" in cetirun-admin
#   4. Create VirtualService "cetirun-admin" routing admin.<your-domain>
#
# Pre-requisites (applied by setup.sh before this CR):
#   - Namespace cetirun-admin (created first so SA can land in it)
#   - ServiceAccount openclaw-admin-cetirun (via deploy/rbac.yaml)
#   - ClusterRole/ClusterRoleBinding adminclaw-admin (via deploy/rbac.yaml)
#   - Secret gateway-token with OPENCLAW_GATEWAY_TOKEN + MODEL_API_KEY (via setup.sh)
apiVersion: cetirun.microsoft.com/v1beta1
kind: Agent
metadata:
  name: admin
spec:
  gatewayTokenSecretRef: "gateway-token"
  helm:
    values:
      azureWorkloadIdentity:
        clientId: "${WORKLOAD_IDENTITY_CLIENT_ID}"
        enabled: ${WORKLOAD_IDENTITY_ENABLED}
      execRestriction:
        enabled: true
      networkPolicy:
        enabled: false
      secrets:
        apiBase: "${MODEL_API_BASE}"
        authMode: "api_key"
        model: "gpt-5.4"
        provider: "openai"
      serviceAccount:
        create: false
        name: "openclaw-admin-cetirun"
      skills:
        shared: ${ENABLE_SKILLS}
  msteams:
    enabled: true
  user:
    alias: admin
    displayName: "CetiRun Admin"
    team: aks-platform
