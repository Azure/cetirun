# CetiAdmin enrollment is created suspended. The referenced Team must bind an
# admin AgentPolicy and permit the selected Sandbox. Starting CetiAdmin also
# requires the future typed Portal-client Sandbox entitlement; arbitrary Helm
# environment, volume, and ServiceAccount overrides are intentionally absent.
apiVersion: cetirun.microsoft.com/v1alpha1
kind: Agent
metadata:
  name: admin
  annotations:
    agentidentity.cetirun.microsoft.com/owner-tenant-id: "${ADMIN_OWNER_TENANT_ID}"
    agentidentity.cetirun.microsoft.com/owner-object-id: "${ADMIN_OWNER_OBJECT_ID}"
spec:
  agent:
    type: hermes
  user:
    alias: admin
    displayName: "CetiRun Admin"
  team: "${ADMIN_TEAM}"
  policyClass: admin
  sandboxRef: "${ADMIN_SANDBOX}"
  model: "${ADMIN_MODEL}"
  modelAccess:
    sharedModels: true
    githubCopilot: false
  agentIdentity:
    enabled: false
  suspended: true
  governance:
    teamAuthorization:
      subject:
        kind: User
        tenantID: "${ADMIN_OWNER_TENANT_ID}"
        objectID: "${ADMIN_OWNER_OBJECT_ID}"
      authorizedAt: "${ADMIN_AUTHORIZED_AT}"
    gatewayBudgetUSD: "${ADMIN_GATEWAY_BUDGET_USD}"
  gatewayTokenSecretRef: gateway-token
