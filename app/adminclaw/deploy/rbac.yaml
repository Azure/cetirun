# BYO ServiceAccount + ClusterRole for AdminClaw (operator-managed deployment).
# Grants broad READ access across the cluster for monitoring/diagnostics,
# plus targeted WRITE access only for remediation operations (pod restart,
# token rotation, config updates, VirtualService re-apply, PVC expansion).
# Key safety constraints: no delete on CRs, no RBAC writes, no admission writes.
#
# Applied by deploy/setup.sh before the OpenClawInstance CR (uses envsubst for NAMESPACE).
# SA name must match the chart fullname: openclaw-admin-cetirun
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-admin-cetirun
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: adminclaw
    app.kubernetes.io/managed-by: adminclaw-deploy
---
# ClusterRole: broad read access across the cluster for monitoring/diagnostics,
# with targeted write permissions only where remediation playbooks require them.
# Key safety constraints:
#   - NO delete on openclawinstances (instance deletion requires another principal)
#   - NO write on RBAC resources (prevents privilege escalation)
#   - NO write on admission, CRDs, certificates, scheduling, nodes, storage classes
#   - Write permissions are scoped to specific resources needed for auto-remediation
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adminclaw-admin
  labels:
    app.kubernetes.io/name: adminclaw
    app.kubernetes.io/managed-by: adminclaw-deploy
rules:
  # ==========================================================================
  # BROAD READ ACCESS — all API groups, for monitoring and diagnostics
  # ==========================================================================
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.istio.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["flowcontrol.apiserver.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # --- Azure / AKS platform API groups ---
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["acn.azure.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aks.clusterconfig.azure.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["clusterconfig.azure.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["azmonitoring.coreos.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # --- Networking / policy API groups ---
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["config.gatekeeper.sh"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["templates.gatekeeper.sh"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # --- Storage / Istio telemetry ---
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["telemetry.istio.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # ==========================================================================
  # TARGETED WRITE ACCESS — only what remediation playbooks actually need
  # ==========================================================================

  # --- Namespaces: create (instance provisioning), no delete ---
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]

  # --- Pods: delete (restart), exec (diagnostics / storage cleanup) ---
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

  # --- Secrets: create + update + patch (token rotation, Helm release metadata) ---
  # No delete — old secrets are overwritten, not removed.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch"]

  # --- ConfigMaps: update + patch (instance config changes) ---
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["update", "patch"]

  # --- PVCs: patch (storage expansion) ---
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["patch"]

  # --- Events: create + patch (audit logging) ---
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

  # --- Istio VirtualServices: create + update + patch (re-apply standard routing) ---
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["create", "update", "patch"]

  # --- CetiRun CRD: write (read is covered in the broad-read section above) ---
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["*"]
    verbs: ["create", "update", "patch"]

  # ==========================================================================
  # NON-RESOURCE URLs — health and metrics endpoints only
  # ==========================================================================
  - nonResourceURLs: ["/healthz", "/healthz/*", "/readyz", "/readyz/*", "/livez", "/livez/*", "/metrics", "/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adminclaw-admin
  labels:
    app.kubernetes.io/name: adminclaw
    app.kubernetes.io/managed-by: adminclaw-deploy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adminclaw-admin
subjects:
  - kind: ServiceAccount
    name: openclaw-admin-cetirun
    namespace: ${NAMESPACE}
