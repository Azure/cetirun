apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cetirun-portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cetirun-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cetirun-portal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: portal
          image: "{{ include "cetirun-portal.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-internal
              containerPort: 8081
              protocol: TCP
          env:
            - name: REGISTRY_CREDENTIAL_NAMESPACE
              value: {{ default .Values.registryCredentials.namespace .Values.global.registryCredentialNamespace | quote }}
            {{- if .Values.istio.host }}
            - name: PORTAL_ORIGIN
              value: {{ printf "https://%s" .Values.istio.host | quote }}
            {{- end }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: INTERNAL_LISTEN_ADDR
              value: ":8081"
            - name: FEATURE_TAILSCALE_ENABLED
              value: {{ default false ((.Values.features).tailscaleEnabled) | quote }}
            - name: MAX_INSTANCES_PER_USER
              value: {{ if hasKey ((.Values.features) | default dict) "maxInstancesPerUser" }}{{ .Values.features.maxInstancesPerUser | quote }}{{ else }}"1"{{ end }}
            - name: ALLOWED_AGENT_TYPES
              value: {{ join "," (default (list "hermes" "openclaw") ((.Values.features).allowedAgentTypes)) | quote }}
            - name: FEATURE_AGENT_IDENTITY_ENABLED
              value: {{ default false ((.Values.features).agentIdentityEnabled) | quote }}
            {{- if default false ((.Values.features).agentIdentityEnabled) }}
            - name: ENTRA_TENANT_ID
              value: {{ required "agentIdentity.tenantId is required when Agent Identity is enabled" .Values.agentIdentity.tenantId | quote }}
            - name: PORTAL_OIDC_CLIENT_ID
              value: {{ required "agentIdentity.portalClientId is required when Agent Identity is enabled" .Values.agentIdentity.portalClientId | quote }}
            - name: AGENT_ID_BROKER_URL
              value: {{ required "agentIdentity.brokerURL is required when Agent Identity is enabled" .Values.agentIdentity.brokerURL | quote }}
            {{- $_ := required "istio.host is required when Agent Identity is enabled" .Values.istio.host }}
            {{- end }}
            - name: ADMIN_ALIASES_FILE
              value: /etc/cetirun-portal/admins/aliases
            {{- if .Values.noticeBanner }}
            - name: NOTICE_BANNER
              value: {{ .Values.noticeBanner | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: admins
              mountPath: /etc/cetirun-portal/admins
              readOnly: true
      volumes:
        - name: admins
          configMap:
            name: {{ include "cetirun-portal.fullname" . }}-admins
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
