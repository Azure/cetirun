apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cetirun-portal.fullname" . }}-admins
  namespace: {{ include "cetirun-portal.namespace" . }}
  labels:
    {{- include "cetirun-portal.labels" . | nindent 4 }}
data:
  aliases: |
{{- range (default (list) ((.Values.admins).aliases)) }}
    {{ . }}
{{- end }}
