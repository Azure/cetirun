{{- if .Values.serviceAccount.create -}}
{{- $annotations := deepCopy (.Values.serviceAccount.annotations | default dict) }}
{{- if include "cetirun-portal.usageEnabled" . }}
{{- $_ := set $annotations "azure.workload.identity/client-id" .Values.usage.adx.clientId }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-portal.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
