---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: teams.cetirun.microsoft.com
spec:
  group: cetirun.microsoft.com
  names:
    kind: Team
    listKind: TeamList
    plural: teams
    shortNames:
    - crt
    singular: team
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.memberContext.role
      name: Role
      type: string
    - jsonPath: .spec.defaults.provider
      name: Provider
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Team is a cluster-scoped resource that defines team-wide configuration
          (user context, AI provider defaults, and skills) applied to every Agent that
          references this team via spec.team.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TeamSpec defines team-wide configuration applied to every
              member instance.
            properties:
              adminAgentPolicyRef:
                description: DeprecatedAdminAgentPolicyRef retains old policy intent
                  for rejection only.
                maxLength: 0
                type: string
              agentPolicyRef:
                description: |-
                  AgentPolicyRef names the policy applied to every Agent in this Team.
                  A Team without any policy or Sandbox fields retains legacy execution.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              defaultSandboxRef:
                description: DefaultSandboxRef selects a listed Sandbox for newly
                  created Agents.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              defaults:
                description: |-
                  Defaults sets the default AI provider for all team members.
                  Per-instance Helm values overrides take precedence when set.
                properties:
                  provider:
                    description: Provider is the default AI provider (e.g. "github_copilot",
                      "anthropic", "openai").
                    type: string
                type: object
              memberContext:
                description: MemberContext defines the team context injected into
                  USER.md for every member instance.
                properties:
                  description:
                    description: 'Description contains lines injected into the ##
                      Context section of USER.md.'
                    items:
                      type: string
                    maxItems: 20
                    type: array
                  role:
                    description: Role is the team member's role, e.g. "Engineer".
                    type: string
                type: object
              normalAgentPolicyRef:
                description: DeprecatedNormalAgentPolicyRef retains old policy intent
                  for rejection only.
                maxLength: 0
                type: string
              sandboxRefs:
                description: SandboxRefs lists the Sandboxes permitted for this Team.
                items:
                  maxLength: 253
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              skillStorage:
                description: |-
                  SkillStorage describes a shared Azure Blob NFS container that the operator
                  mounts read-only into every member instance's pod. When set, the operator
                  populates the chart's skills.shared mode with the given storage account
                  coordinates so that a PV+PVC are auto-provisioned per instance namespace.
                properties:
                  containerName:
                    description: ContainerName of the blob container holding the skills
                      tree.
                    type: string
                  mountPath:
                    description: |-
                      MountPath inside the container. Defaults to the chart default
                      ("/home/vibe/.aks/skills") when empty.
                    type: string
                  resourceGroup:
                    description: ResourceGroup of the Azure storage account.
                    type: string
                  storageAccount:
                    description: StorageAccount name (globally unique, lowercase alphanumeric,
                      3-24 chars).
                    type: string
                  storageClassName:
                    description: |-
                      StorageClassName for the auto-provisioned PV/PVC. Defaults to the
                      chart default ("azureblob-nfs-premium") when empty.
                    type: string
                  storageSize:
                    description: |-
                      StorageSize requested for the PVC. Defaults to the chart default
                      ("100Gi") when empty.
                    type: string
                required:
                - containerName
                - resourceGroup
                - storageAccount
                type: object
              skills:
                description: |-
                  Skills is the list of default skills for all team members.
                  Each entry is a ClawHub package ID (e.g. "@anthropic/mcp-server-fetch")
                  or an npm package prefixed with "npm:" (e.g. "npm:@openclaw/matrix").
                items:
                  pattern: ^(npm:)?(@[a-z0-9][\w.-]*\/)?[a-z0-9][\w.-]*(@[\w.+-]+)?$
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: set
            type: object
          status:
            description: TeamStatus defines the observed state of Team.
            properties:
              conditions:
                description: Conditions contains the latest available observations
                  of the team's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last CR generation that was
                  fully reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
