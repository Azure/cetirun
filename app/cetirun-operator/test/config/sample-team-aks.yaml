apiVersion: cetirun.microsoft.com/v1beta1
kind: Team
metadata:
  name: aks
spec:
  memberContext:
    role: "AKS Engineer"
    description:
      - "Works on Azure Kubernetes Service (AKS)"
      - "Likely deals with oncall, incidents, Kusto queries, TSG docs, and RP/node/networking issues"
  defaults:
    provider: "github_copilot"
  # Optional: shared Azure Blob NFS storage holding team-wide skills tree.
  # When set, the operator auto-provisions a PV+PVC per instance namespace
  # and mounts the container read-only at /home/vibe/.aks/skills.
  # skillStorage:
  #   resourceGroup: my-rg
  #   storageAccount: myskillsaccount
  #   containerName: skills
