apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cetirun-operator-manager-role
  labels:
    app.kubernetes.io/name: cetirun-operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  # OpenClawInstance CRD
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["openclawinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["openclawinstances/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["openclawinstances/finalizers"]
    verbs: ["update"]

  # OpenClawTeam CRD (cluster-scoped; operator watches to re-enqueue instances on team changes)
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["openclawteams"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["openclawteams/status"]
    verbs: ["get", "update", "patch"]

  # Namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # RBAC delegation (principle of least privilege):
  # The operator does NOT have cluster-wide access to Secrets, ConfigMaps, Services,
  # StatefulSets, PVCs, or ServiceAccounts. Instead, during each reconcile it
  # dynamically creates a namespaced Role + RoleBinding in cetirun-<alias>, granting
  # itself those permissions only within that one namespace (see ensureNamespacedRBAC
  # in openclawinstance_controller.go). This limits blast radius if the operator SA
  # is compromised — it cannot read secrets from unrelated namespaces.
  #
  # "list" and "watch" are required here so that controller-runtime's informer cache
  # can start up (it lists and watches all resource types it manages at startup).
  #
  # NOTE: Kubernetes privilege-escalation prevention requires that a principal can only
  # grant permissions it already holds. The operator therefore needs these permissions
  # in its ClusterRole even though it only *uses* them in the per-instance namespaces.
  # The security boundary is enforced by the namespaced Role — the operator cannot act
  # on these resources in any namespace that does NOT have an cetirun-operator-ns-role
  # RoleBinding, which it only creates for namespaces it manages.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Batch Jobs (pre-upgrade hook creates Jobs in instance namespaces)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Secrets, ConfigMaps, Services, StatefulSets, PVCs, ServiceAccounts:
  # Required so the operator can delegate these permissions via ensureNamespacedRBAC.
  # See the RBAC delegation note above — Kubernetes prevents granting permissions
  # not held by the grantor, so these must appear here even though the operator only
  # exercises them inside cetirun-<alias> namespaces.
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # PersistentVolumes (cluster-scoped, created by the openclaw chart for shared-skills)
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # NetworkPolicies (created by the openclaw Helm chart in each instance namespace)
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Istio VirtualServices + Sidecar (egress scope)
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "sidecars"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ValidatingAdmissionPolicy (cluster-scoped, created by the openclaw chart to block kubectl exec)
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Leader election (Lease objects)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
