# Default values for cetirun-operator chart.

# -- Shared release coordinates. An umbrella chart can set these once for all
# CetiRun subcharts.
global:
  # -- Optional registry hostname override for all CetiRun images and charts.
  # Empty preserves the component defaults below.
  registry: ""
  # -- Optional shared image and chart version override.
  # Empty preserves the component and Chart.appVersion defaults below.
  version: ""
  registryCredentialNamespace: ""

# -- This chart owns the Registry source namespace. Portal and Operator must
# use the same namespace; do not reuse the Agent Identity Broker namespace.
registryCredentials:
  namespace: cetirun-registry-credentials
  createNamespace: true

# -- Number of operator replicas (leader election keeps only one active).
replicaCount: 2

# -- Operator container image.
image:
  repository: cetirun.azurecr.io/cetirun-operator
  pullPolicy: IfNotPresent
  tag: "" # Defaults to .Chart.AppVersion
  # -- Image digest for pinning (e.g. sha256:abc123...). When set, pins the image; the tag is kept for readability.
  digest: ""

# -- Image pull secrets.
imagePullSecrets: []

# -- Name of a kubernetes.io/dockerconfigjson Secret in the operator namespace
# whose credentials are passed to the Helm registry client via DOCKER_CONFIG.
# Required when the OCI chart registry (e.g. ACR) is private and the node's
# kubelet identity does not surface docker credentials inside the pod.
acrDockerSecret: ""

# -- Namespace to deploy the operator into.
# The namespace is created by the operator's Helm chart installation, not by the operator itself.
namespace: cetirun-system

# -- Istio revision label for AKS managed Istio sidecar injection.
# When empty (default), the operator auto-detects the revision from
# ConfigMaps in aks-istio-system. Set explicitly to override auto-detection
# or to pin a specific revision (e.g. "asm-1-22").
istioRevision: ""

# -- Namespace/name of the Istio Gateway used by instance VirtualServices.
istioGateway: "aks-istio-ingress/cetirun-gateway"

# -- Base domain suffix for instance access URLs (e.g. alias.example.com).
domainSuffix: ""

# -- CetiRun Helm chart configuration.
cetirun:
  # -- Default GitHub Copilot model for instances that do not specify spec.model.
  # Override this only with a model authorized for the deployment's Copilot users.
  defaultModel: "gpt-6-astra"
  chart:
    # -- OCI registry URL.
    repoURL: oci://cetirun.azurecr.io/helm/cetirun
    # -- Chart version to deploy.
    version: "0.1.1"
  # -- Operator-level Helm value overrides applied to every CetiRun instance.
  # Merged on top of the operator's hardcoded defaults but beneath
  # per-instance spec.helm.values, so instances can still override them.
  # Example:
  #   cetirun:
  #     helmValues:
  #       skills:
  #         shared: true
  #         resourceGroup: "my-rg"
  #         storageAccount: "cetirunskills"
  helmValues: {}

# -- Enable leader election (recommended for production with replicaCount > 1).
leaderElection: true

# -- Resource requests/limits for the operator pod.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 2Gi

# -- Node selector for the operator pod.
nodeSelector: {}

# -- Tolerations for the operator pod.
tolerations: []

# -- Affinity rules for the operator pod.
affinity: {}

# -- Additional pod annotations.
podAnnotations: {}

# -- Trusted callers of private Custom Chat endpoints; not tenant overrides.
chatAccess:
  enabled: false
  callers: []

# -- Service account configuration.
serviceAccount:
  create: true
  name: cetirun-operator-controller-manager
  annotations: {}

# -- Configuration admission only; this does not enable governed execution or
# provide a qualified Sandbox capability registration.
sandboxAdmission:
  # -- CR object decoding: compatible tolerates fields from a newer schema;
  # strict rejects them. Authorization, Pod checks and server config stay strict.
  validationMode: compatible
  # -- Deploy the independent, read-only admission server first.
  # Requires Kubernetes >= 1.37, the validated admission minimum. The server
  # uses native lifecycle sleep for an image-independent shutdown delay.
  enabled: false
  # -- Install fail-closed webhooks only after the server and TLS are ready.
  # Requires Kubernetes >= 1.37, including native admission matchConditions.
  enforce: false
  # -- Serve final-Pod checks; matching is installed only with enforce=true.
  # Also denies exec/attach/portforward in controller-marked namespaces.
  # Requires immutable namespace protection and a qualified lifecycle producer
  # of controller-owned expectations. No execution-ready producer is installed;
  # protected writes fail closed and execution stays held. Other Pod mutators
  # must exclude these namespaces; arbitrary injected metadata is not accepted.
  podsEnabled: false
  # -- Optional operator-namespace placement.json ConfigMap. Requires Pod
  # admission. When enforced, placement checks cover every namespace's Pod
  # writes and bindings; an unavailable registry/server fails those requests.
  # This does not supply a fencing receipt or authorize Agent execution.
  placementConfigMapName: ""
  # -- Optional UID-pinned coordination authority for Team/Sandbox/AgentPolicy
  # updates and deletions. Requires strict, enforced configuration and Pod admission.
  # Both fields are required. No state is created and no execution is enabled.
  coordinationConfigMapName: ""
  coordinationConfigMapUID: ""
  # -- Timeout for each fail-closed webhook call; integer 1..30 when enforce=true.
  # Pod validation uses 80% of this budget, with at most four concurrent source
  # GETs per request; the remainder is reserved for transport and response.
  timeoutSeconds: 10
  replicaCount: 2
  # -- Optional existing platform-managed PriorityClass. No class is created
  # or selected automatically.
  priorityClassName: ""
  # -- Admission-only placement; never inherits the operator's placement.
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # -- Existing platform-issued TLS Secret in namespace, containing tls.crt and
  # tls.key. The certificate must cover cetirun-sandbox-admission.<namespace>.svc.
  # This chart does not issue certificates or install cert-manager.
  tlsSecretName: ""
  # -- Base64-encoded PEM CA bundle supplied by the platform issuer. Required
  # when enforce=true. Helm checks encoding/framing, not certificate trust,
  # expiry, CA constraints, or the serving certificate's subject names.
  caBundle: ""
  # -- Exact authenticated Kubernetes usernames/groups allowed to administer
  # configuration. At least one nonempty list is required even before enforce.
  adminUsers: []
  adminGroups: []
  # -- Trusted Kubernetes user/group to Team creation assignments. Conflicting
  # memberships reject; Portal roles or caller-provided Team names are not proof.
  teamAssignments: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Kubernetes capability declarations for configuration admission and held
# native Sandbox preparation. Both use the same operator-namespace platform.json.
# Does not qualify a platform or implement writer fencing. Execution stays held.
# Adds controller write permissions for compiled namespaced CiliumNetworkPolicies.
# Adds only get permission on shared Istio Gateways for pinned access inputs.
sandboxSources:
  enabled: false
  # -- Create owned namespace, HOME and native authentication only for new namespaces.
  # Requires explicit Agent chart/image/port pins. Published content stays external.
  bootstrapOwnedPrerequisites: false
  # -- Existing operator-namespace ConfigMap containing versioned platform.json.
  # Shared by configuration admission and the controller only when enabled.
  # The platform owner supplies qualification, topology and exact object pins.
  platformConfigMapName: ""
  # -- Claims in each protected Agent namespace; never adopted by name.
  homeClaimName: home
  skillsClaimName: skills
  # -- Optional separate operator-namespace ConfigMap containing skills.json.
  # Requires owned bootstrap. Selects already-published Blob NFS content by Team UID;
  # creates only retained, read-only static PV/PVC bindings, never source content.
  skillsCatalogConfigMapName: ""
  # -- Optional placement.json registry for durable namespace/HOME/Node binding.
  # Must match sandboxAdmission.placementConfigMapName. Records the existing
  # reservation after zero-replica staging; does not enroll Nodes or grant execution.
  placementConfigMapName: ""
  # -- Approved native helpers; arbitrary injected containers remain unsupported.
  helpers:
    doctor: false
    logger: false
    desktop: false

# -- Microsoft Entra Agent Identity lifecycle configuration. The feature is
# deployment-scoped and remains disabled unless every required field is set.
agentIdentity:
  enabled: false
  # Keep lifecycle credentials available while existing identities are being
  # disabled or deleted after creation has been turned off.
  cleanupEnabled: false
  tenantId: ""
  blueprintClientId: ""
  namePrefix: "cetirun-agent"
  brokerURL: "http://cetirun-agent-broker.cetirun-credentials.svc.cluster.local:8080"

# -- Platform AI Gateway integration: the operator gives each built-in Agent
# its own virtual key and routes OpenClaw model traffic through the Gateway:
# the shared models every Agent may use and, per Agent, a GitHub Copilot proxy
# for the owner's account. The cetirun-platform chart installs the Gateway and
# requires this. While the operator has a Gateway to call, with enabled on or
# url set, deleting an Agent waits until its key is revoked; turning enabled
# off stops creating keys, not revoking them. Set neither to stop calling the
# Gateway, for example once it has been removed.
aiGateway:
  # -- OpenClaw and Hermes Agents take their models from the platform AI
  # Gateway. The platform chart requires it; turning it off leaves OpenClaw
  # Agents without models, while Hermes Agents fall back to their own provider
  # and sign-in.
  enabled: true
  # -- In-cluster Gateway URL: http://<service>.<namespace>.svc.cluster.local:<port>.
  # Empty means the Gateway named cetirun-ai-gateway in the operator namespace,
  # where the platform chart installs it.
  url: ""
  # -- Secret in the operator namespace that holds the Gateway master key. A
  # Gateway installed separately must run in the operator namespace, or its
  # master key Secret must be copied there.
  masterKeySecret:
    name: cetirun-ai-gateway-auth
    key: master-key
  # -- Monthly budget in US dollars written when a key is created. Changes an
  # administrator makes later in the Gateway are kept.
  defaultBudget: 10000
  # -- Preferred default model of Agents that name none. Agents fall back to
  # the first model available to them when it is not.
  defaultModel: ""
  # -- Per-Agent GitHub Copilot proxy. Agents keep it unless their owner
  # turns GitHub Copilot off. It runs the AI Gateway image. Turned off here,
  # OpenClaw Agents use only shared models, and the Portal creates none while
  # no shared model is offered.
  copilotProxy:
    enabled: true
    image:
      repository: cetirun.azurecr.io/cetirun-ai-gateway
      # -- Defaults to the release version.
      tag: ""
      digest: ""

# -- Override the chart's default skills storage account.
# Empty string (default) means use the chart's built-in default.
# Deprecated: use cetirun.helmValues.skills.storageAccount instead.
skillsStorageAccount: ""

# -- Opt-in provisioning for approved Custom images. Qualify each image's
# UID/GID against this HOME storage and select its model-access mode explicitly.
customRuntime:
  enabled: false
  agentManagedModel: false
  approvedImages: []
  # -- Subset of approvedImages qualified to use the platform AI Gateway.
  # Other approved images retain explicit image-owned authentication.
  gatewayImages: []
  storageClass: default
  storageSize: 100Gi
  accessMode: ReadWriteOnce
  fsGroup: 1024
  context:
    AGENTS.md: |
      # CetiRun agent context
      Work within the owner's requested scope. Approved skills are available
      under $HOME/.agents/skills. Read a relevant SKILL.md before using it.
      This context and the skills view are read-only. Preserve user files.
      Use cetirun-memory for durable notes in private HOME. Do not put credentials
      or private session content into shared skills.
    skills/cetirun-memory/SKILL.md: |
      ---
      name: cetirun-memory
      description: Preserve useful owner-approved notes in the instance's private HOME.
      ---
      Store durable notes under $HOME/memory. Read relevant existing notes before
      extending them. Preserve unrelated notes and distinguish facts from assumptions.
      Do not store passwords, tokens or authentication responses. Never write memory
      into the read-only skills directory or shared storage.

# -- Azure configuration for Teams auto-provisioning.
# Only required when instances use msteams.enabled=true.
azure:
  # -- Azure subscription ID for Bot Service resources.
  subscriptionId: ""
  # -- Resource group for Bot Service resources.
  resourceGroup: ""
  # -- Name prefix for Bot Service and AAD app registrations (<prefix>-<alias>).
  botNamePrefix: ""
  # -- Azure AD tenant ID for bot app registrations.
  tenantId: ""
  # -- Optional serviceManagementReference for AAD app registrations.
  serviceTreeId: ""
  # -- Client ID of the operator's managed identity (enables workload identity).
  clientId: ""
  # -- FIC Issuer IDs mapping (JSON object: {"tenantId":"issuerId",...}).
  # Used when the tenant requires a trusted issuer for Federated Identity Credentials.
  ficIssuerIds: ""
