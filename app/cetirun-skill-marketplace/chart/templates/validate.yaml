{{- $repository := .Values.repository -}}
{{- $storage := .Values.storage -}}
{{- if not $repository.url -}}
{{- fail "repository.url is required" -}}
{{- end -}}
{{- if not (has $repository.auth (list "none" "token" "ssh")) -}}
{{- fail "repository.auth must be none, token or ssh" -}}
{{- end -}}
{{- if and (ne $repository.auth "none") (not $repository.existingSecret) -}}
{{- fail "repository.existingSecret is required for token and ssh authentication" -}}
{{- end -}}
{{- if and (hasPrefix "https://" $repository.url) (contains "@" (trimPrefix "https://" $repository.url | splitList "/" | first)) -}}
{{- fail "repository.url must not contain credentials; use repository.existingSecret" -}}
{{- end -}}
{{- if and (hasPrefix "http://" $repository.url) (not $repository.allowInsecureHTTP) -}}
{{- fail "repository.url must use https://" -}}
{{- end -}}
{{- range $field := list "resourceGroup" "storageAccount" "containerName" "storageClassName" -}}
{{- if not (get $storage $field) -}}
{{- fail (printf "storage.%s is required" $field) -}}
{{- end -}}
{{- end -}}
{{- if not (regexMatch "^[a-z0-9]{3,24}$" $storage.storageAccount) -}}
{{- fail "storage.storageAccount must be 3-24 lowercase letters and digits" -}}
{{- end -}}
{{- if or (not (regexMatch "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$" $storage.containerName)) (contains "--" $storage.containerName) -}}
{{- fail "storage.containerName must be a valid Blob container name" -}}
{{- end -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.agentClaims.claimName) -}}
{{- fail "agentClaims.claimName must be a valid resource name" -}}
{{- end -}}
{{- $limits := .Values.limits | default dict -}}
{{- range $field := list "maxRepositoryObjects" "maxSkillFiles" "maxSkillDepth" "maxDescriptionLength" -}}
{{- if not (regexMatch "^[1-9][0-9]{0,8}$" (toString (get $limits $field))) -}}
{{- fail (printf "limits.%s must be a positive whole number" $field) -}}
{{- end -}}
{{- end -}}
{{- range $field := list "maxRepositorySize" "maxSkillSize" "maxSkillMDSize" -}}
{{- if not (regexMatch "^[1-9][0-9]{0,11}(Ki|Mi|Gi)?$" (toString (get $limits $field))) -}}
{{- fail (printf "limits.%s must be a size such as 5Mi: a positive whole number, optionally with Ki, Mi or Gi" $field) -}}
{{- end -}}
{{- end -}}
