apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "cetirun-agent-tools-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "cetirun-agent-tools-mcp.selectorLabels" . | nindent 6 }}
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "cetirun-agent-tools-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "cetirun-agent-tools-mcp.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              {{- toYaml .Values.istio.agentNamespaces | nindent 14 }}
      to:
        - operation:
            ports: ["8443"]
