{{- if not .Values.serviceAccount.create }}{{ fail "Agent Tools MCP requires a dedicated ServiceAccount" }}{{ end -}}
{{- if empty .Values.tls.secretName }}{{ fail "tls.secretName is required" }}{{ end -}}
{{- if not (hasPrefix "https://" .Values.broker.baseURL) }}{{ fail "broker.baseURL must use HTTPS" }}{{ end -}}
{{- if and .Values.portal.baseURL (not (hasPrefix "https://" .Values.portal.baseURL)) }}{{ fail "portal.baseURL must use HTTPS" }}{{ end -}}
{{- if empty .Values.workloadTokenAudience }}{{ fail "workloadTokenAudience is required" }}{{ end -}}
{{- if not .Values.istio.enabled }}{{ fail "Agent Tools MCP requires Istio mTLS authorization" }}{{ end -}}
{{- if not .Values.istio.sidecarInjection }}{{ fail "istio.sidecarInjection must be true" }}{{ end -}}
{{- if empty .Values.istio.revision }}{{ fail "istio.revision is required" }}{{ end -}}

{{- if eq .Release.Namespace .Values.istio.brokerNamespace }}{{ fail "MCP workload and Broker credentials require distinct namespaces" }}{{ end -}}
