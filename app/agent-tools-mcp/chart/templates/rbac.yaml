apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cetirun-agent-tools-mcp.fullname" . }}
  labels:
    {{- include "cetirun-agent-tools-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "serviceaccounts", "namespaces"]
    verbs: ["get"]
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["agents"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cetirun-agent-tools-mcp.fullname" . }}
  labels:
    {{- include "cetirun-agent-tools-mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cetirun-agent-tools-mcp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cetirun-agent-tools-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
