replicaCount: 2

image:
  repository: ghcr.io/azure/agent-tools-mcp
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: agent-tools-mcp
  annotations: {}

service:
  port: 443

tls:
  # Existing Secret holding tls.crt and tls.key. The chart never creates TLS material.
  secretName: ""

broker:
  # HTTPS origin only. Mesh mTLS is enforced by Istio independently of TLS verification.
  baseURL: ""
  clientTLSSecretName: ""

portal:
  # Optional HTTPS origin for connections_start_link.
  baseURL: ""

workloadTokenAudience: agent-tools-mcp

operationRecords:
  # Dedicated namespace for only 7-day write operation records, never provider credentials.
  namespace: cetirun-agent-tools-mcp-operations
  createNamespace: true

istio:
  enabled: true
  sidecarInjection: false
  revision: ""
  brokerNamespace: cetirun-credentials
  controlPlaneNamespace: aks-istio-system
  agentNamespaces:
    - cetirun-*

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
