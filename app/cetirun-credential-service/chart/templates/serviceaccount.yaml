apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cetirun-credential-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-credential-service.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.agentIdentity.encryptionClientId | quote }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
