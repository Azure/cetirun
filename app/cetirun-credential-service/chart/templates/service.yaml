apiVersion: v1
kind: Service
metadata:
  name: {{ include "cetirun-credential-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-credential-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cetirun-credential-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
