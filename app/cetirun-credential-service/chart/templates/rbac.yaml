apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cetirun-credential-service.fullname" . }}
  labels:
    {{- include "cetirun-credential-service.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cetirun.microsoft.com"]
    resources: ["agents"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cetirun-credential-service.fullname" . }}
  labels:
    {{- include "cetirun-credential-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cetirun-credential-service.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cetirun-credential-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cetirun-credential-service.fullname" . }}-records
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-credential-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cetirun-credential-service.fullname" . }}-records
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cetirun-credential-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cetirun-credential-service.fullname" . }}-records
subjects:
  - kind: ServiceAccount
    name: {{ include "cetirun-credential-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
