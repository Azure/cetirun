replicaCount: 2

image:
  repository: ghcr.io/azure/cetirun-agent-broker
  # Empty defaults to .Chart.AppVersion.
  tag: ""
  # When set, produces repository:tag@digest.
  digest: ""
  pullPolicy: IfNotPresent

authSDK:
  repository: mcr.microsoft.com/entra-sdk/auth-sidecar
  tag: 1.0.0-azurelinux3.0-distroless
  # Pinned digest for the tag above. Update tag and digest together.
  digest: sha256:b3e6204abb87daa9c414dcade11f16060e030d114b81ecbd8bd2a7346e107523
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: cetirun-agent-broker
  annotations: {}

service:
  port: 8080

tls:
  enabled: false
  secretName: ""
  certKey: tls.crt
  keyKey: tls.key
  clientCAKey: ca.crt

agentIdentity:
  tenantId: ""
  blueprintClientId: ""
  authorizationClientId: ""
  encryptionClientId: ""
  keyVaultKeyUrl: ""
  redirectUri: ""
  portalOrigin: ""
  portalBaseUrl: ""
  armScopes:
    - https://management.azure.com/user_impersonation
  graphScopes:
    - https://graph.microsoft.com/.default
  armPermissions:
    - user_impersonation
  graphPermissions:
    - Mail.Read
    - Mail.Send
    - Calendars.ReadWrite

portal:
  namespace: cetirun-portal
  serviceAccount: cetirun-portal

toolService:
  namespace: cetirun-system
  serviceAccount: agent-tools-mcp

providers:
  github:
    credentialsSecretName: ""
    clientIDKey: client-id
    clientSecretKey: client-secret
  google:
    credentialsSecretName: ""
    clientIDKey: client-id
    clientSecretKey: client-secret

operator:
  namespace: cetirun-system
  serviceAccount: cetirun-operator-controller-manager

istio:
  enabled: true
  # Confirms that the release namespace is labeled for sidecar injection.
  sidecarInjection: false
  # AKS managed Istio revision selected for this workload and namespace.
  revision: ""

resources:
  broker:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  authSDK:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
