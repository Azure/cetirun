{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "cetirun-agent-broker.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "cetirun-agent-broker.selectorLabels" . | nindent 6 }}
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "cetirun-agent-broker.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "cetirun-agent-broker.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ .Values.portal.namespace }}/sa/{{ .Values.portal.serviceAccount }}
      to:
        - operation:
            ports: ["8080"]
            paths: ["/internal/v1/*", "/healthz", "/readyz"{{ if .Values.connectionBindings.enabled }}, "/v1/connections*", "/v1/instances/*"{{ end }}]
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ .Values.operator.namespace }}/sa/{{ .Values.operator.serviceAccount }}
      to:
        - operation:
            ports: ["8080"]
            methods: ["DELETE"]
            # Istio StringMatch supports a trailing prefix wildcard. The Go
            # ServeMux still exposes only the exact bounded cleanup route.
            paths: ["/operator/v1/instances/*"]
    - from:
        - source:
            # Istio string matching supports a trailing prefix wildcard. The
            # Broker still maps the exact mTLS namespace + ServiceAccount to a
            # single Agent CR before serving any request.
            namespaces: ["cetirun-*"]
      to:
        - operation:
            ports: ["8080"]
            paths: ["/v1/*"]
    {{- if .Values.connectionBindings.enabled }}
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ .Values.toolService.namespace }}/sa/{{ .Values.toolService.serviceAccount }}
      to:
        - operation:
            ports: ["8443"]
    {{- end }}
{{- end }}
