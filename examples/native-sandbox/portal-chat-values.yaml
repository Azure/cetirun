# Install the standalone Portal chart as release cetirun-portal in cetirun-portal-chat.
# Replace the public example host, identity realm, and application IDs before deployment.
serviceAccount:
  create: true
  name: cetirun-portal
chat:
  enabled: true
  identityRealm: example-tenant
  sandboxStateNamespace: cetirun-system
aiGateway:
  catalogNamespace: cetirun-system
features:
  aiGatewayEnabled: true
istio:
  host: portal.example.com
  gateway: aks-istio-ingress/cetirun-gateway
  gatewayNamespace: aks-istio-ingress
  gatewayServiceAccount: aks-istio-ingressgateway-external
  sidecarInjection: true
  internalAuthMTLS: true
agentIdentity:
  tenantId: 11111111-1111-1111-1111-111111111111
  portalClientId: 22222222-2222-2222-2222-222222222222
