version: 2
updates:
  # GitHub Actions — keep action refs up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  # Dockerfiles. Shared image updates must stay atomic because the CI toolchain
  # contract requires every Go builder to use the same digest.
  - package-ecosystem: "docker"
    directories:
      - "/app/cetirun-connections-mcp"
      - "/app/cetirun-agent-broker"
      - "/app/cetirun-memory-context"
      - "/app/cetirun-chart"
      - "/app/cetirun-operator"
      - "/app/cetirun-portal"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        group-by: "dependency-name"

  # Keep locally linked application modules and internal contracts in sync,
  # including dependencies that are indirect in the consumer.
  - package-ecosystem: "gomod"
    directories:
      - "/app/cetirun-connections-mcp"
      - "/app/internal"
      - "/app/cetirun-memory-context"
      - "/app/cetirun-agent-broker"
      - "/app/cetirun-operator"
      - "/app/cetirun-portal"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    groups:
      go-modules:
        patterns:
          - "*"
      go-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # npm — portal frontend
  - package-ecosystem: "npm"
    directory: "/app/cetirun-portal/web"
    schedule:
      interval: "weekly"
