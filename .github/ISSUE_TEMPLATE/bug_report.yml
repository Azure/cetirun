name: Bug report
description: Report a reproducible problem with CetiRun.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before you submit a report, search the issues that already exist.
        For suspected security vulnerabilities, stop here and follow [SECURITY.md](https://github.com/Azure/cetirun/blob/main/SECURITY.md) to report privately to MSRC.
        Everything that you submit must be safe to publish. Use synthetic examples. Do not attach full logs, credentials, cookies, private endpoints, tenant or subscription identifiers, customer data, agent conversations, or internal documents.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Runtime chart or container
        - Operator or CRDs
        - Portal backend
        - Portal frontend
        - AI Gateway
        - Agent Identity Broker or Connections MCP
        - Memory
        - CetiAdmin
        - Skill Marketplace
        - Runtime plugin
        - Infrastructure or Istio configuration
        - Documentation
        - Other or unsure
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Smallest reproduction
      description: Include steps and a minimal configuration. Use only synthetic data.
      placeholder: |
        1. Use this component and configuration ...
        2. Do this action ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Versions
      description: Include the CetiRun commit, image tag or digest, chart version, and the version of OpenClaw, Hermes, or the Custom Agent image where relevant. Say if a version is unknown.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the relevant OS, architecture, Kubernetes, Helm, Go, or Node.js versions and the installation method. Do not include account identifiers or private resource names.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Sanitized output or more context
      description: Share only a short relevant excerpt that is safe to publish, or describe a workaround. Do not paste a full diagnostic bundle.
      render: text

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before you submit
      options:
        - label: I searched the issues that already exist.
          required: true
        - label: This is not a suspected security vulnerability. I will use MSRC for those reports.
          required: true
        - label: I examined the text and attachments and removed secrets, private identifiers, customer data, and other non-public information.
          required: true
