name: Help request
description: Ask a question about how to use or develop CetiRun.
title: "[Help]: "
body:
  - type: markdown
    attributes:
      value: |
        First, search the documentation and the issues that already exist. For support expectations, refer to [SUPPORT.md](https://github.com/Azure/cetirun/blob/main/SUPPORT.md).
        Use synthetic examples and short, sanitized output. Do not share credentials, cookies, kubeconfigs, private endpoints or identifiers, customer data, agent conversations, or internal documents.
        Report suspected vulnerabilities privately through [SECURITY.md](https://github.com/Azure/cetirun/blob/main/SECURITY.md).

  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
      description: Describe your goal and the CetiRun component or runtime involved.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What did you try?
      description: Explain the point where you cannot continue. Include only commands or configuration that are safe to publish.
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Versions and environment
      description: Include the CetiRun commit, chart or image version, OpenClaw or Hermes version, and relevant tool versions. Do not include account identifiers or private resource names.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: A short excerpt is enough. Do not upload full logs or diagnostic bundles.
      render: text

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before you submit
      options:
        - label: I searched the documentation and the issues that already exist.
          required: true
        - label: This is not a suspected security vulnerability. I will use MSRC for those reports.
          required: true
        - label: I examined the text and attachments and removed secrets, private identifiers, customer data, and other non-public information.
          required: true
