name: Feature request
description: Suggest an improvement to CetiRun.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem that you want to solve, and search the requests that already exist first.
        Keep all examples and attachments safe to publish. Do not include credentials, private identifiers or endpoints, customer data, agent conversations, or internal documents.
        Report suspected vulnerabilities privately through [SECURITY.md](https://github.com/Azure/cetirun/blob/main/SECURITY.md), not this form.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What do you want to do with CetiRun, who is affected, and what prevents it?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior that you want and how you can see that the improvement works.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested approach
      description: If you have an approach, describe it and the affected components. Include the effects on APIs, CRDs, authentication, isolation, storage, or current users.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any current features or workarounds that you tried and why they were not enough.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before you submit
      options:
        - label: For this request, I searched the issues that already exist.
          required: true
        - label: This is not a suspected security vulnerability. I will use MSRC for those reports.
          required: true
        - label: I examined the text and attachments and removed secrets, private identifiers, customer data, and other non-public information.
          required: true
