name: Gateway Release

on:
  push:
    tags:
      - "gateway-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. gateway-v0.1.0). Must match Chart.yaml."
        required: true
        type: string

concurrency:
  group: gateway-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The Gateway ships no image of its own: it runs upstream LiteLLM, mirrored to
# MCR rather than rebuilt, so this workflow publishes only the chart.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract and validate version from tag
        id: version
        run: |
          # workflow_dispatch: use input tag; push: use git tag
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#gateway-v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '${tag}' is not a valid gateway tag (expected gateway-vX.Y.Z)" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${version}"

      - name: Validate Chart.yaml matches tag version
        run: |
          version="${{ steps.version.outputs.version }}"
          chart_version="$(awk -F': *' '$1=="version" {print $2; exit}' app/cetirun-gateway-chart/Chart.yaml)"
          app_version="$(awk -F': *' '$1=="appVersion" {gsub(/"/, "", $2); print $2; exit}' app/cetirun-gateway-chart/Chart.yaml)"

          errors=0
          if [ "${chart_version}" != "${version}" ]; then
            echo "ERROR: Chart.yaml version '${chart_version}' does not match tag version '${version}'" >&2
            errors=1
          fi
          if [ "${app_version}" != "${version}" ]; then
            echo "ERROR: Chart.yaml appVersion '${app_version}' does not match tag version '${version}'" >&2
            errors=1
          fi
          if [ "${errors}" -ne 0 ]; then
            exit 1
          fi
          echo "Chart version: ${chart_version}, App version: ${app_version} validated."

      - name: Install pinned Helm
        run: |
          python3 scripts/ci/install_tools.py --bin-dir "$RUNNER_TEMP/cetirun-tools" helm
          echo "$RUNNER_TEMP/cetirun-tools" >> "$GITHUB_PATH"

      - name: Helm lint
        run: |
          helm lint --strict app/cetirun-gateway-chart
          helm lint --strict app/cetirun-gateway-chart -f app/cetirun-gateway-chart/ci/render-values.yaml

      - name: Render assertions
        run: bash scripts/gateway-helm-test.sh

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Helm
        run: |
          python3 scripts/ci/install_tools.py --bin-dir "$RUNNER_TEMP/cetirun-tools" helm
          echo "$RUNNER_TEMP/cetirun-tools" >> "$GITHUB_PATH"

      - name: Log in to prod Helm OCI registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | helm registry login "${{ secrets.ACR_REGISTRY }}" --username "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Package and push Helm chart
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          VERIFY_PULL: "true"
        run: scripts/gateway-helm-release.sh

      # E2E_ACR_REGISTRY doubles as the stage ACR, matching the other release
      # workflows, so the stage environment can pull the chart.
      - name: Log in to stage Helm OCI registry
        run: echo "${{ secrets.E2E_ACR_PASSWORD }}" | helm registry login "${{ secrets.E2E_ACR_REGISTRY }}" --username "${{ secrets.E2E_ACR_USERNAME }}" --password-stdin

      - name: Package and push Helm chart to stage ACR
        env:
          REGISTRY: ${{ secrets.E2E_ACR_REGISTRY }}
          VERIFY_PULL: "true"
        run: scripts/gateway-helm-release.sh

      - name: Release summary
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_TEST_REGISTRY: ${{ secrets.E2E_ACR_REGISTRY }}
        run: |
          version="${{ needs.validate.outputs.version }}"
          {
            echo "## Gateway Release Summary"
            echo ""
            echo "**Version:** ${version}"
            echo ""
            echo "### Artifacts"
            echo "- Helm chart (prod): \`helm pull oci://${ACR_REGISTRY}/helm/cetirun-gateway --version ${version}\`"
            echo "- Helm chart (test): \`helm pull oci://${ACR_TEST_REGISTRY}/helm/cetirun-gateway --version ${version}\`"
            echo ""
            echo "No image is published here. The chart runs upstream LiteLLM, mirrored to MCR."
          } >> "$GITHUB_STEP_SUMMARY"
