name: Istio Release

on:
  push:
    tags:
      - "istio-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. istio-v0.1.0). Must match Chart.yaml."
        required: true
        type: string

concurrency:
  group: istio-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract and validate version from tag
        id: version
        run: |
          # workflow_dispatch: use input tag; push: use git tag
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#istio-v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '${tag}' is not a valid istio tag (expected istio-vX.Y.Z)" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${version}"

      - name: Validate Chart.yaml matches tag version
        run: |
          version="${{ steps.version.outputs.version }}"
          chart_version="$(awk -F': *' '$1=="version" {print $2; exit}' infra/istio/Chart.yaml)"

          if [ "${chart_version}" != "${version}" ]; then
            echo "ERROR: Chart.yaml version '${chart_version}' does not match tag version '${version}'" >&2
            exit 1
          fi
          echo "Chart version: ${chart_version} validated."

      - name: Helm lint
        run: helm lint infra/istio

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to prod Helm OCI registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | helm registry login "${{ secrets.ACR_REGISTRY }}" --username "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Package and push Helm chart to prod ACR
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          VERSION: ${{ needs.validate.outputs.version }}
          VERIFY_PULL: "true"
        run: scripts/istio-helm-release.sh

      - name: Log in to stage Helm OCI registry
        run: echo "${{ secrets.E2E_ACR_PASSWORD }}" | helm registry login "${{ secrets.E2E_ACR_REGISTRY }}" --username "${{ secrets.E2E_ACR_USERNAME }}" --password-stdin

      - name: Package and push Helm chart to stage ACR
        env:
          REGISTRY: ${{ secrets.E2E_ACR_REGISTRY }}
          VERSION: ${{ needs.validate.outputs.version }}
          VERIFY_PULL: "true"
        run: scripts/istio-helm-release.sh

      - name: Release summary
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_TEST_REGISTRY: ${{ secrets.E2E_ACR_REGISTRY }}
        run: |
          version="${{ needs.validate.outputs.version }}"
          echo "## Istio Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Helm chart (prod): \`helm pull oci://${ACR_REGISTRY}/helm/cetirun-istio --version ${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Helm chart (stage): \`helm pull oci://${ACR_TEST_REGISTRY}/helm/cetirun-istio --version ${version}\`" >> "$GITHUB_STEP_SUMMARY"
