name: Operator CI

on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: operator-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-build-test:
    name: Operator Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/cetirun-operator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: app/cetirun-operator/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test ./... -v -count=1

      - name: Install CRD generator and envtest
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: |
          make tools
          echo "$PWD/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/cetirun-envtest"
          archive="$RUNNER_TEMP/cetirun-envtest/envtest.tar.gz"
          curl --fail --location --retry 3 --max-time 120 \
            -o "$archive" \
            https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.37.0/envtest-v1.37.0-linux-amd64.tar.gz
          printf '%s  %s\n' f03faedfc68d2a78cee5cb02618bb44e7f67044f4c5fc957f72d3307fda61a9c "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP/cetirun-envtest"
          echo "KUBEBUILDER_ASSETS=$RUNNER_TEMP/cetirun-envtest/controller-tools/envtest" >> "$GITHUB_ENV"

      - name: Verify generated API artifacts
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
        run: make verify-generated

      - name: Test Agent API admission
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
        run: make test-envtest

      - name: Run go build
        run: |
          CGO_ENABLED=0 go build -o bin/manager ./cmd/main.go
          CGO_ENABLED=0 go build -o bin/terminal ./cmd/terminal

      - name: Test terminal reconnect client
        run: node --test internal/terminal/reconnect.test.cjs

      - name: Install govulncheck
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: GOBIN="$RUNNER_TEMP/cetirun-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check reachable Go vulnerabilities
        env:
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: '"$RUNNER_TEMP/cetirun-tools/govulncheck" ./...'

  docker-build:
    name: Operator image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/cetirun-operator/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cetirun-operator:validation
          cache-from: type=gha,scope=cetirun-operator
          cache-to: type=gha,mode=max,scope=cetirun-operator

      - name: Gate image on fixable high and critical CVEs
        run: python3 scripts/ci/scan_image.py --image cetirun-operator:validation

  terminal-image:
    name: Terminal image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build terminal image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/cetirun-operator/Dockerfile.terminal
          platforms: linux/amd64
          push: false
          load: true
          tags: cetirun-terminal:validation
          cache-from: type=gha,scope=cetirun-terminal
          cache-to: type=gha,mode=max,scope=cetirun-terminal

      - name: Gate terminal image on fixable high and critical CVEs
        run: python3 scripts/ci/scan_image.py --image cetirun-terminal:validation
