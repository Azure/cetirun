name: Operator CI

on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: operator-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-build-test:
    name: Operator Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/cetirun-operator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: app/cetirun-operator/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test ./... -v -count=1

      - name: Run go build
        run: CGO_ENABLED=0 go build -o bin/manager ./cmd/main.go

      - name: Install govulncheck
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: GOBIN="$RUNNER_TEMP/cetirun-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check reachable Go vulnerabilities
        env:
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: '"$RUNNER_TEMP/cetirun-tools/govulncheck" ./...'

  docker-build:
    name: Operator image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: app/cetirun-operator/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cetirun-operator:validation
          cache-from: type=gha,scope=cetirun-operator
          cache-to: type=gha,mode=max,scope=cetirun-operator

      - name: Gate image on fixable high and critical CVEs
        run: python3 scripts/ci/scan_image.py --image cetirun-operator:validation
