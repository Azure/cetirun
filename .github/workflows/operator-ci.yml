name: Operator CI

on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: operator-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-build-test:
    name: Operator Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/cetirun-operator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            app/cetirun-operator/go.sum
            app/internal/go.sum
            app/cetirun-portal/go.sum

      - name: Check shared internal packages
        working-directory: app/internal
        run: |
          go vet ./...
          go test ./... -v -count=1

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: make test

      - name: Install CRD generator and pinned admission test tools
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: |
          make tools
          echo "$PWD/bin" >> "$GITHUB_PATH"
          tools_dir="$RUNNER_TEMP/cetirun-admission-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B ../../scripts/ci/install_tools.py --bin-dir "$tools_dir" envtest helm
          echo "$tools_dir" >> "$GITHUB_PATH"
          echo "KUBEBUILDER_ASSETS=$tools_dir" >> "$GITHUB_ENV"

      - name: Verify generated API artifacts
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
        run: make verify-generated

      - name: Test Agent API admission
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
        run: make test-envtest

      - name: Download Portal API test modules
        working-directory: app/cetirun-portal
        env:
          GOTOOLCHAIN: local
        run: go mod download

      - name: Test Portal lifecycle and Sandbox API contracts
        working-directory: app/cetirun-portal
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          KUBECONFIG: /dev/null
          USE_EXISTING_CLUSTER: "false"
        run: go test -tags=envtest ./internal/kube ./internal/handler -run '^Test(RetainedRestartThroughServedAPI|SandboxDefaultsThroughPortalAndServedAPI)$' -count=1

      - name: Run go build
        run: |
          CGO_ENABLED=0 go build -o bin/manager ./cmd/main.go
          CGO_ENABLED=0 go build -o bin/terminal ./cmd/terminal

      - name: Test terminal reconnect client
        run: node --test internal/terminal/reconnect.test.cjs

      - name: Install govulncheck
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: GOBIN="$RUNNER_TEMP/cetirun-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check reachable Go vulnerabilities
        env:
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: '"$RUNNER_TEMP/cetirun-tools/govulncheck" ./...'

  docker-build:
    name: Operator image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/cetirun-operator/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cetirun-operator:validation
          cache-from: type=gha,scope=cetirun-operator
          cache-to: type=gha,mode=max,scope=cetirun-operator

      - name: Gate image on fixable high and critical CVEs
        run: python3 scripts/ci/scan_image.py --image cetirun-operator:validation

  terminal-image:
    name: Terminal image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build terminal image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/cetirun-operator/Dockerfile.terminal
          platforms: linux/amd64
          push: false
          load: true
          tags: cetirun-terminal:validation
          cache-from: type=gha,scope=cetirun-terminal
          cache-to: type=gha,mode=max,scope=cetirun-terminal

      - name: Gate terminal image on fixable high and critical CVEs
        run: python3 scripts/ci/scan_image.py --image cetirun-terminal:validation
