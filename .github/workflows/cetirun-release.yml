name: CetiRun Release

on:
  push:
    tags:
      - "cetirun-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. cetirun-v0.1.0). Must match Chart.yaml."
        required: true
        type: string

concurrency:
  group: cetirun-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Package registries can be overridden independently for general and OpenClaw builds.
env:
  NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org/' }}
  OPENCLAW_NPM_REGISTRY: ${{ vars.OPENCLAW_NPM_REGISTRY || 'https://registry.npmjs.org/' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract and validate version from tag
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#cetirun-v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '${version}' is not valid semver (expected X.Y.Z)" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${version}"

      - name: Validate Chart.yaml matches tag version
        run: |
          version="${{ steps.version.outputs.version }}"
          chart_version="$(awk -F': *' '$1=="version" {print $2; exit}' app/cetirun-chart/Chart.yaml)"
          app_version="$(awk -F': *' '$1=="appVersion" {print $2; exit}' app/cetirun-chart/Chart.yaml)"

          errors=0
          if [ "${chart_version}" != "${version}" ]; then
            echo "ERROR: Chart.yaml version '${chart_version}' does not match tag version '${version}'" >&2
            errors=1
          fi
          if [ "${errors}" -ne 0 ]; then
            exit 1
          fi
          echo "Chart version: ${version}, App version: ${app_version} validated."

      - name: Helm lint
        run: scripts/cetirun-helm-lint.sh

      - name: Helm test
        run: scripts/cetirun-helm-test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Build base image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/cetirun-chart
          file: app/cetirun-chart/Dockerfile.base
          push: false
          tags: cetirun-base:validation
          build-args: |
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}

      - name: Build OpenClaw image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/cetirun-chart
          file: app/cetirun-chart/Dockerfile.openclaw
          push: false
          build-args: |
            BASE_IMAGE=cetirun-base:validation
            NPM_REGISTRY=${{ env.OPENCLAW_NPM_REGISTRY }}
          tags: openclaw-gateway:validation

      - name: Build Hermes image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/cetirun-chart
          file: app/cetirun-chart/Dockerfile.hermes
          push: false
          build-args: |
            BASE_IMAGE=cetirun-base:validation
          tags: hermes-gateway:validation

      - name: Build desktop sidecar image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/cetirun-chart
          file: app/cetirun-chart/Dockerfile.desktop
          push: false
          tags: cetirun-desktop:validation

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/cetirun-chart
          file: app/cetirun-chart/Dockerfile.base
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/cetirun-base:${{ needs.validate.outputs.version }}
            ${{ secrets.ACR_REGISTRY }}/cetirun-base:latest

      - name: Build and push OpenClaw image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/cetirun-chart
          file: app/cetirun-chart/Dockerfile.openclaw
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=${{ secrets.ACR_REGISTRY }}/cetirun-base:${{ needs.validate.outputs.version }}
            NPM_REGISTRY=${{ env.OPENCLAW_NPM_REGISTRY }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/openclaw-gateway:${{ needs.validate.outputs.version }}
            ${{ secrets.ACR_REGISTRY }}/openclaw-gateway:latest

      - name: Build and push Hermes image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/cetirun-chart
          file: app/cetirun-chart/Dockerfile.hermes
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=${{ secrets.ACR_REGISTRY }}/cetirun-base:${{ needs.validate.outputs.version }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/hermes-gateway:${{ needs.validate.outputs.version }}
            ${{ secrets.ACR_REGISTRY }}/hermes-gateway:latest

      - name: Build and push desktop sidecar image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/cetirun-chart
          file: app/cetirun-chart/Dockerfile.desktop
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/cetirun-desktop:${{ needs.validate.outputs.version }}
            ${{ secrets.ACR_REGISTRY }}/cetirun-desktop:latest

      - name: Log in to prod Helm OCI registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | helm registry login "${{ secrets.ACR_REGISTRY }}" --username "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Package and push Helm chart
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          VERIFY_PULL: "true"
        run: scripts/cetirun-helm-release.sh

      # E2E_ACR_REGISTRY selects the stage registry.
      # Releasing to it here ensures the stage CD workflow can pull the image.
      - name: Log in to stage ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.E2E_ACR_REGISTRY }}
          username: ${{ secrets.E2E_ACR_USERNAME }}
          password: ${{ secrets.E2E_ACR_PASSWORD }}

      - name: Copy Docker image to stage ACR
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.E2E_ACR_REGISTRY }}/openclaw-gateway:${VERSION}" \
            --tag "${{ secrets.E2E_ACR_REGISTRY }}/openclaw-gateway:latest" \
            "${{ secrets.ACR_REGISTRY }}/openclaw-gateway:${VERSION}"

      - name: Copy Hermes image to stage ACR
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.E2E_ACR_REGISTRY }}/hermes-gateway:${VERSION}" \
            --tag "${{ secrets.E2E_ACR_REGISTRY }}/hermes-gateway:latest" \
            "${{ secrets.ACR_REGISTRY }}/hermes-gateway:${VERSION}"

      - name: Copy base image to stage ACR
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.E2E_ACR_REGISTRY }}/cetirun-base:${VERSION}" \
            --tag "${{ secrets.E2E_ACR_REGISTRY }}/cetirun-base:latest" \
            "${{ secrets.ACR_REGISTRY }}/cetirun-base:${VERSION}"

      - name: Copy desktop sidecar image to stage ACR
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.E2E_ACR_REGISTRY }}/cetirun-desktop:${VERSION}" \
            --tag "${{ secrets.E2E_ACR_REGISTRY }}/cetirun-desktop:latest" \
            "${{ secrets.ACR_REGISTRY }}/cetirun-desktop:${VERSION}"

      - name: Log in to stage Helm OCI registry
        run: echo "${{ secrets.E2E_ACR_PASSWORD }}" | helm registry login "${{ secrets.E2E_ACR_REGISTRY }}" --username "${{ secrets.E2E_ACR_USERNAME }}" --password-stdin

      - name: Package and push Helm chart to stage ACR
        env:
          REGISTRY: ${{ secrets.E2E_ACR_REGISTRY }}
          VERIFY_PULL: "true"
        run: scripts/cetirun-helm-release.sh

      - name: Release summary
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_TEST_REGISTRY: ${{ secrets.E2E_ACR_REGISTRY }}
        run: |
          version="${{ needs.validate.outputs.version }}"
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker base image (prod): \`${ACR_REGISTRY}/cetirun-base:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker base image (test): \`${ACR_TEST_REGISTRY}/cetirun-base:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image (prod): \`${ACR_REGISTRY}/openclaw-gateway:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image (test): \`${ACR_TEST_REGISTRY}/openclaw-gateway:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image Hermes (prod): \`${ACR_REGISTRY}/hermes-gateway:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image Hermes (test): \`${ACR_TEST_REGISTRY}/hermes-gateway:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image desktop (prod): \`${ACR_REGISTRY}/cetirun-desktop:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image desktop (test): \`${ACR_TEST_REGISTRY}/cetirun-desktop:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Helm chart (prod): \`helm pull oci://${ACR_REGISTRY}/helm/cetirun --version ${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Helm chart (test): \`helm pull oci://${ACR_TEST_REGISTRY}/helm/cetirun --version ${version}\`" >> "$GITHUB_STEP_SUMMARY"
