name: Portal Release

on:
  push:
    tags:
      - "portal-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. portal-v0.1.0). Must match Chart.yaml."
        required: true
        type: string

concurrency:
  group: portal-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# A repository or organization NPM_REGISTRY variable can override this default.
env:
  NPM_CONFIG_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org/' }}
  NPM_CONFIG_REPLACE_REGISTRY_HOST: npmjs

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract and validate version from tag
        id: version
        run: |
          # workflow_dispatch: use input tag; push: use git tag
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#portal-v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '${tag}' is not a valid portal tag (expected portal-vX.Y.Z)" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${version}"

      - name: Validate Chart.yaml matches tag version
        run: |
          version="${{ steps.version.outputs.version }}"
          chart_version="$(awk -F': *' '$1=="version" {print $2; exit}' app/cetirun-portal/chart/Chart.yaml)"
          app_version="$(awk -F': *' '$1=="appVersion" {gsub(/"/, "", $2); print $2; exit}' app/cetirun-portal/chart/Chart.yaml)"

          errors=0
          if [ "${chart_version}" != "${version}" ]; then
            echo "ERROR: Chart.yaml version '${chart_version}' does not match tag version '${version}'" >&2
            errors=1
          fi
          if [ "${app_version}" != "${version}" ]; then
            echo "ERROR: Chart.yaml appVersion '${app_version}' does not match tag version '${version}'" >&2
            errors=1
          fi
          if [ "${errors}" -ne 0 ]; then
            exit 1
          fi
          echo "Chart version: ${chart_version}, App version: ${app_version} validated."

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: app/cetirun-portal/web
        run: npm ci

      - name: Build frontend
        working-directory: app/cetirun-portal/web
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version

      - name: Run go vet
        working-directory: app/cetirun-portal
        run: go vet ./...

      - name: Run go test
        working-directory: app/cetirun-portal
        run: |
          go -C ../internal test ./... -v -count=1
          go test ./... -v -count=1

      - name: Run go build
        working-directory: app/cetirun-portal
        run: CGO_ENABLED=0 go build -o bin/portal .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/cetirun-portal/Dockerfile
          platforms: linux/amd64
          push: false
          tags: cetirun-portal:validation
          build-args: |
            NPM_REGISTRY=${{ env.NPM_CONFIG_REGISTRY }}

      - name: Helm lint
        run: helm lint app/cetirun-portal/chart

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ACR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/cetirun-portal/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            GIT_SHA=${{ github.sha }}
            NPM_REGISTRY=${{ env.NPM_CONFIG_REGISTRY }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/cetirun-portal:${{ needs.validate.outputs.version }}
            ${{ secrets.ACR_REGISTRY }}/cetirun-portal:latest

      - name: Log in to prod Helm OCI registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | helm registry login "${{ secrets.ACR_REGISTRY }}" --username "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Package and push Helm chart
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          VERSION: ${{ needs.validate.outputs.version }}
          VERIFY_PULL: "true"
        run: scripts/portal-helm-release.sh

      # E2E_ACR_REGISTRY selects the stage registry.
      # Releasing to it here ensures the stage CD workflow can pull the image.
      - name: Log in to stage ACR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.E2E_ACR_REGISTRY }}
          username: ${{ secrets.E2E_ACR_USERNAME }}
          password: ${{ secrets.E2E_ACR_PASSWORD }}

      - name: Copy Docker image to stage ACR
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.E2E_ACR_REGISTRY }}/cetirun-portal:${VERSION}" \
            --tag "${{ secrets.E2E_ACR_REGISTRY }}/cetirun-portal:latest" \
            "${{ secrets.ACR_REGISTRY }}/cetirun-portal:${VERSION}"

      - name: Log in to stage Helm OCI registry
        run: echo "${{ secrets.E2E_ACR_PASSWORD }}" | helm registry login "${{ secrets.E2E_ACR_REGISTRY }}" --username "${{ secrets.E2E_ACR_USERNAME }}" --password-stdin

      - name: Package and push Helm chart to stage ACR
        env:
          REGISTRY: ${{ secrets.E2E_ACR_REGISTRY }}
          VERSION: ${{ needs.validate.outputs.version }}
          VERIFY_PULL: "true"
        run: scripts/portal-helm-release.sh

      - name: Release summary
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_TEST_REGISTRY: ${{ secrets.E2E_ACR_REGISTRY }}
        run: |
          version="${{ needs.validate.outputs.version }}"
          echo "## Portal Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image (prod): \`${ACR_REGISTRY}/cetirun-portal:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image (test): \`${ACR_TEST_REGISTRY}/cetirun-portal:${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Helm chart (prod): \`helm pull oci://${ACR_REGISTRY}/helm/cetirun-portal --version ${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Helm chart (test): \`helm pull oci://${ACR_TEST_REGISTRY}/helm/cetirun-portal --version ${version}\`" >> "$GITHUB_STEP_SUMMARY"
