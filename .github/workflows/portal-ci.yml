name: Portal CI

on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A repository or organization NPM_REGISTRY variable can override this default.
env:
  NPM_CONFIG_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org/' }}
  NPM_CONFIG_REPLACE_REGISTRY_HOST: npmjs

jobs:
  frontend-test-build:
    name: Portal frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/cetirun-portal/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/cetirun-portal/web/package-lock.json

      - name: Check version-pinned license supplements
        id: license-supplements
        run: npm run licenses:check-updates -- --output "$RUNNER_TEMP/portal-license-update.patch"

      - name: Save proposed license supplement update for review
        if: failure() && steps.license-supplements.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-license-update
          path: ${{ runner.temp }}/portal-license-update.patch
          if-no-files-found: ignore
          retention-days: 7

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify generated third-party notices
        run: |
          test -s dist/THIRD_PARTY_LICENSES.txt
          npm run licenses -- --output "$RUNNER_TEMP/portal-THIRD_PARTY_LICENSES.txt"
          cmp dist/THIRD_PARTY_LICENSES.txt "$RUNNER_TEMP/portal-THIRD_PARTY_LICENSES.txt"

  go-build-test:
    name: Portal Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/cetirun-portal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            app/cetirun-portal/go.sum
            app/cetirun-operator/go.sum
            app/internal/go.sum

      - name: Create placeholder for embed
        run: mkdir -p web/dist && touch web/dist/.keep

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test ./... -v -count=1

      - name: Run go build
        run: CGO_ENABLED=0 go build -o bin/portal .

      - name: Install govulncheck
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: GOBIN="$RUNNER_TEMP/cetirun-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check reachable Go vulnerabilities
        env:
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: '"$RUNNER_TEMP/cetirun-tools/govulncheck" ./...'

  docker-build:
    name: Portal image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/cetirun-portal/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cetirun-portal:validation
          build-args: |
            NPM_REGISTRY=${{ env.NPM_CONFIG_REGISTRY }}
          cache-from: type=gha,scope=cetirun-portal
          cache-to: type=gha,mode=max,scope=cetirun-portal

      - name: Gate image on fixable high and critical CVEs
        run: python3 scripts/ci/scan_image.py --image cetirun-portal:validation
