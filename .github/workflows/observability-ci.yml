name: Observability CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: observability-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  images:
    name: Observability image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements.txt
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
      - name: Install pinned Helm
        run: |
          python3 scripts/ci/install_tools.py --bin-dir "$RUNNER_TEMP/cetirun-tools" helm
          echo "$RUNNER_TEMP/cetirun-tools" >> "$GITHUB_PATH"
      # CetiRun does not build the ADX-Mon images: the job pulls the images
      # that the chart pins, checks that each program accepts the chart's
      # flags, and gates them on fixable high and critical CVEs.
      - name: Check the pinned ADX-Mon images
        run: python3 scripts/ci/check_observability_images.py
