name: Observability CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: observability-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    name: Observability image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the ADX-Mon image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/cetirun-observability
          file: app/cetirun-observability/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cetirun-observability:validation
          cache-from: type=gha,scope=cetirun-observability
          cache-to: type=gha,mode=max,scope=cetirun-observability
      # The programs resolve the host name when they load, so the containers
      # keep the default network.
      - name: Both programs start and print their usage
        run: |
          docker run --rm --read-only --cap-drop ALL --entrypoint /collector \
            cetirun-observability:validation --help | grep -q -- '--config'
          docker run --rm --read-only --cap-drop ALL --entrypoint /ingestor \
            cetirun-observability:validation --help | grep -q -- '--logs-kusto-endpoints'
      - name: Gate image on fixable high and critical CVEs
        run: python3 scripts/ci/scan_image.py --image cetirun-observability:validation
