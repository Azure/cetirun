name: Agent Identity Broker CI

on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: agent-broker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-build-test:
    name: Agent Identity Broker Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/cetirun-agent-broker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test ./... -v -count=1

      - name: Run go build
        run: CGO_ENABLED=0 go build -o bin/agent-broker .

      - name: Install govulncheck
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: GOBIN="$RUNNER_TEMP/cetirun-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check reachable Go vulnerabilities
        env:
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOTELEMETRY: "off"
        run: '"$RUNNER_TEMP/cetirun-tools/govulncheck" ./...'

  docker-build:
    name: Agent Identity Broker image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/cetirun-agent-broker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: cetirun-agent-broker:validation
          cache-from: type=gha,scope=cetirun-agent-broker
          cache-to: type=gha,mode=max,scope=cetirun-agent-broker

      - name: Gate image on fixable high and critical CVEs
        run: python3 scripts/ci/scan_image.py --image cetirun-agent-broker:validation
