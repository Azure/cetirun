name: CodeQL Advanced

on:
  pull_request:
  push:
    branches:
      - "main"
  schedule:
    - cron: "23 4 * * 1" # Weekly on Monday, UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Switch from Default Setup after merge; it blocks Advanced CodeQL uploads.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Go does not support build-mode: none. Explicit builds cover all modules
      # without invoking repository Makefiles, tests, generators, or npm scripts.
      - name: Build all Go modules
        if: matrix.language == 'go'
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
        run: |
          mkdir -p app/cetirun-portal/web/dist
          touch app/cetirun-portal/web/dist/.keep
          (cd app/cetirun-operator && go build -a ./...)
          (cd app/cetirun-portal && go build -a ./...)
          (cd app/cetirun-credential-service && go build -a ./...)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
