name: CetiRun Validation

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cetirun-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cetirun-connections-mcp:
    name: CetiRun Connections MCP offline Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/cetirun-connections-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Validate MCP and Azure REST execution
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          go test -race ./... -count=1
          go vet ./...
          CGO_ENABLED=0 go build ./...

  cetirun-skill-marketplace:
    name: CetiRun Skill Marketplace offline Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/cetirun-skill-marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      # The module has external dependencies; only this step uses the network.
      - name: Download Skill Marketplace modules
        env:
          GOTOOLCHAIN: local
        run: go mod download
      - name: Validate repository sync, Team releases and Agent claims
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          go test -race ./... -count=1
          go vet ./...
          CGO_ENABLED=0 go build ./...

  license-headers:
    name: CetiRun license headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check first-party source headers across the repository
        run: make license-check

  policy-tests:
    name: CetiRun policy and helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release metadata, Python syntax, and offline helper regressions
        run: make version-check python-check ci-test

  python-tests:
    name: CetiRun auth and runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements.txt
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
      - name: Test auth and runtime helpers offline
        run: make python-test

  static-checks:
    name: CetiRun Bicep shell and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned static validators
        run: |
          python3 scripts/ci/install_tools.py --bin-dir "$RUNNER_TEMP/cetirun-tools" actionlint shellcheck bicep
          echo "$RUNNER_TEMP/cetirun-tools" >> "$GITHUB_PATH"
      - name: Compile Bicep without restore, lint shell and validation workflows
        run: make bicep-check shell-check workflow-check

  dependency-review:
    name: CetiRun dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never
          warn-only: false
