name: Helm Lint and Test

on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: helm-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Helm lint
        run: scripts/cetirun-helm-lint.sh

      - name: Helm template test
        run: scripts/cetirun-helm-test.sh
