name: Helm Lint and Test

on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: helm-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Helm all charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Helm
        run: |
          python3 scripts/ci/install_tools.py --bin-dir "$RUNNER_TEMP/cetirun-tools" helm
          echo "$RUNNER_TEMP/cetirun-tools" >> "$GITHUB_PATH"

      - name: Lint and render all four charts and runtime variants
        run: make chart-check
